name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete offline audit
        run: ./run_tests.sh
      - name: Verify manifest coverage
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path('.')
          listed = {
              line.split('  ', 1)[1]
              for line in pathlib.Path('MANIFEST.sha256').read_text().splitlines()
              if line.strip()
          }
          on_disk = {
              str(path) for path in root.rglob('*')
              if path.is_file() and '.git' not in path.parts and '__pycache__' not in path.parts
              and path.name != 'MANIFEST.sha256'
          }
          assert listed == on_disk, f'manifest mismatch: missing={sorted(on_disk-listed)[:5]} stale={sorted(listed-on_disk)[:5]}'
          print(f'manifest covers all {len(listed)} files')
          PY
